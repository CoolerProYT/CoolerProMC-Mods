# Builds the site and publishes it to GitHub Pages (same setup as the mod wikis).
# One-time setup:
#   1. Settings > Pages > Source: "GitHub Actions", custom domain: coolerpromc.com
#   2. Settings > Secrets and variables > Actions > New repository secret: CF_API_KEY
#      (from https://console.curseforge.com). Without it the committed download snapshot is used.
name: Deploy

on:
  push:
    branches: [master]
  # Refresh CurseForge download counts once a day. Modrinth stats are fetched live in the browser.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
